<article class="product-card" [class.product-card--sold-out]="isSoldOut()">
  <a class="product-card__link" [routerLink]="link()">
    @if (image(); as cover) {
      <img
        class="product-card__image"
        [src]="cover.url"
        [alt]="cover.alt"
        [width]="cover.width"
        [height]="cover.height"
        [attr.loading]="eager() ? 'eager' : 'lazy'"
        [attr.fetchpriority]="eager() ? 'high' : 'auto'"
        decoding="async"
      />
    }

    <!-- The anchor wraps the name, so the link text is the product itself. -->
    <h3 class="product-card__name">{{ product().name }}</h3>
  </a>

  <p class="product-card__tagline">{{ product().tagline }}</p>

  @if (price(); as displayPrice) {
    <p class="product-card__price">{{ displayPrice }}</p>
  }

  @if (isSoldOut()) {
    <p class="product-card__status">Out of stock</p>
  } @else if (showSalonSearch()) {
    <!--
      A link, not a button: the brand sells through authorised salons only, so
      the action navigates to the stockist search rather than mutating a cart.
      It is a sibling of the card's own anchor, never a descendant.
    -->
    <a
      class="product-card__quick-add btn btn--secondary btn--sm"
      [routerLink]="distributorsLink"
      [attr.aria-label]="'Search for a salon near you stocking ' + product().name"
    >
      Search Near By Salon
    </a>
  }
</article>
