<div class="section-title" [class.section-title--center]="align() === 'center'">
  @if (eyebrow(); as label) {
    <p class="section-title__eyebrow" [attr.aria-hidden]="eyebrowDecorative() ? 'true' : null">
      {{ label }}
    </p>
  }

  <!-- Rendered as a real heading element so the document outline stays intact. -->
  @switch (level()) {
    @case (1) {
      <h1 class="section-title__heading">{{ title() }}</h1>
    }
    @case (3) {
      <h3 class="section-title__heading">{{ title() }}</h3>
    }
    @case (4) {
      <h4 class="section-title__heading">{{ title() }}</h4>
    }
    @case (5) {
      <h5 class="section-title__heading">{{ title() }}</h5>
    }
    @case (6) {
      <h6 class="section-title__heading">{{ title() }}</h6>
    }
    @default {
      <h2 class="section-title__heading">{{ title() }}</h2>
    }
  }

  @if (subtitle(); as text) {
    <p class="section-title__subtitle">{{ text }}</p>
  }

  <!-- Slot for a call to action alongside the heading. -->
  <ng-content />
</div>
