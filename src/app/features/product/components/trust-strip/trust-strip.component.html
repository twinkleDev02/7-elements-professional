<section class="trust-strip" aria-label="Why professionals choose 7 Elements">
  <ul class="trust-strip__panel" role="list">
    @for (item of items(); track item.id) {
      <li class="trust-strip__item">
        <span class="trust-strip__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            @for (path of item.iconPaths; track $index) {
              <path [attr.d]="path" />
            }
          </svg>
        </span>

        <span class="trust-strip__text">
          <span class="trust-strip__title">{{ item.title }}</span>
          <span class="trust-strip__subtitle">{{ item.subtitle }}</span>
        </span>
      </li>
    }
  </ul>
</section>
