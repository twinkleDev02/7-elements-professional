@if (totalPages() > 1) {
  <nav class="distributor-pagination" aria-label="Distributor results pages">
    <button
      class="distributor-pagination__step"
      type="button"
      aria-label="Previous page"
      [disabled]="!canPrev()"
      (click)="go(currentPage() - 1)"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M15 5l-7 7 7 7" />
      </svg>
    </button>

    <ul class="distributor-pagination__pages" role="list">
      @for (slot of slots(); track $index) {
        <li>
          @if (slot === null) {
            <span class="distributor-pagination__gap" aria-hidden="true">…</span>
          } @else {
            <button
              class="distributor-pagination__page"
              type="button"
              [class.is-active]="slot === currentPage()"
              [attr.aria-label]="'Page ' + slot"
              [attr.aria-current]="slot === currentPage() ? 'page' : null"
              (click)="go(slot)"
            >
              {{ slot }}
            </button>
          }
        </li>
      }
    </ul>

    <button
      class="distributor-pagination__step distributor-pagination__step--next"
      type="button"
      [disabled]="!canNext()"
      (click)="go(currentPage() + 1)"
    >
      <span>Next</span>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 12h15M13 6l6 6-6 6" />
      </svg>
    </button>
  </nav>
}
